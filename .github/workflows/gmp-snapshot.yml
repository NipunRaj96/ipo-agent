name: gmp-snapshot

on:
  schedule:
    # The main trigger is an outside timer (cron-job.org) calling workflow_dispatch at 11:00, 14:00, 16:00 IST,
    # because GitHub drops or delays scheduled runs. These are fallbacks: one weekday run and one weekend run.
    - cron: "45 10 * * 1-5"
    - cron: "30 5 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0, pinned to a commit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0, pinned to a commit
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python src/log_gmp.py
      - name: Build message and record verdicts
        run: python src/predict.py > message.html
      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "GMP snapshot $(date -u +%FT%TZ)" && git pull --rebase origin main && git push)
      - name: Telegram alert
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/notify.py < message.html

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=ipo-agent: ${{ github.workflow }} failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
