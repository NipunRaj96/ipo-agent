name: gmp-snapshot

on:
  schedule:
    # The main trigger is an outside timer (cron-job.org) calling workflow_dispatch at 11:00, 14:00, 16:00 IST,
    # because GitHub drops or delays scheduled runs. These are fallbacks: one weekday run and one weekend run.
    - cron: "45 10 * * 1-5"
    - cron: "30 5 * * 0,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas lxml scikit-learn
      - run: python src/log_gmp.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gmp_log.csv data/sub_log.csv
          git diff --cached --quiet || (git commit -m "GMP snapshot $(date -u +%FT%TZ)" && git push)
      - name: Telegram alert
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/predict.py | python src/notify.py
