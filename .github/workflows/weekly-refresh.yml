name: weekly-refresh

on:
  schedule:
    # Saturday 10:30 IST, after the week's listings.
    - cron: "0 5 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas lxml
      - run: python src/update_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipos.csv data/live_dataset.csv
          git diff --cached --quiet || (git commit -m "Weekly data refresh" && git push)
